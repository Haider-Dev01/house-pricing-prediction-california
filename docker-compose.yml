version: "3.9"

services:

  # ── Étape 0 : Entraînement des modèles ─────────────────────────────────────
  # Ce service tourne une seule fois pour entraîner et sauvegarder tous les modèles.
  # Il s'arrête automatiquement quand l'entraînement est terminé.
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: house_trainer
    volumes:
      - ./models:/app/models    # persist trained models on host
      - ./data:/app/data
    command: python train.py
    profiles: ["train"]         # lancé uniquement via : docker compose --profile train up trainer

  # ── Service 1 : API FastAPI ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: house_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models    # lecture des modèles sauvegardés
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - house_network

  # ── Service 2 : Interface Streamlit ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: house_app
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models    # lecture des métriques et de l'historique DL
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - house_network

networks:
  house_network:
    driver: bridge
